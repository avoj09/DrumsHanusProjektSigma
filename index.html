<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>67 Ultimate Drums Mixer</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fff;
            color: #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            padding-bottom: max(40px, env(safe-area-inset-bottom));
            gap: 32px;
        }

        .inputs {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 7px;
            line-height: 2;
            color: #333;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }

        input[type="text"],
        input[type="number"] {
            background: #fff;
            border: 2px solid #000;
            color: #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 12px 10px;
            outline: none;
            width: 100%;
            text-align: center;
            border-radius: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            box-shadow: 0 0 0 2px #000;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }
        input[type="number"] { -moz-appearance: textfield; }

        #start-clear-div {
            display: flex;
            gap: 16px;
        }

        #buttons-div {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: min(280px, 90vw);
            margin: 0 auto;
        }

        #buttons-div button:last-child {
            grid-column: 2 / 3;
        }

        button {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            background: #fff;
            color: #000;
            border: 2px solid #000;
            padding: 14px 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.1s, color 0.1s;
            white-space: nowrap;
            min-height: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: #000;
            color: #fff;
        }

        button:active {
            background: #333;
            color: #fff;
        }

        #clear-btn {
            border-color: #aaa;
            color: #555;
        }

        #clear-btn:hover {
            background: #aaa;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="letters-input" class="inputs">
        Zadejte sem písmena (jen a,s,d,f,g,h,j):
        <input id="input" type="text">
    </div>

    <div id="frekvence-div" class="inputs">
        Zadej frekvenci v milisekundach (ideál 353):
        <input id="frekvence" type="number">
    </div>

    <div id="start-clear-div">
        <button id="input-btn">Start</button>
        <button id="clear-btn">Clear</button>
    </div>

    <div id="buttons-div">
        <button id="btn1">breakRoll</button>
        <button id="btn2">kick</button>
        <button id="btn3">ride1</button>
        <button id="btn4">ride2</button>
        <button id="btn5">snare1</button>
        <button id="btn6">snare2</button>
        <button id="btn7">triplet</button>
    </div>

    <div id="output" style="display:none"></div>

    <script src="./script.js"></script>
</body>
</html>
